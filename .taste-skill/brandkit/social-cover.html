<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>LabManager — anteprima social Traccia</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:Manrope;src:url('/brandkit/fonts/manrope-400.ttf');font-weight:400}
@font-face{font-family:Manrope;src:url('/brandkit/fonts/manrope-700.ttf');font-weight:700}
@font-face{font-family:Fraunces;src:url('/brandkit/fonts/fraunces-400.ttf');font-weight:400}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#f5f1e8;color:#223d32;font:400 24px/1.5 Manrope,sans-serif;display:grid;grid-template-columns:710px 490px}
main{padding:48px 56px;display:flex;flex-direction:column;align-items:start}
.brand{display:flex;gap:14px;align-items:center;font-size:30px;font-weight:700}.brand img{width:48px;height:48px}
h1{font:400 80px/1.08 Fraunces,serif;letter-spacing:-.035em;margin:56px 0 24px;max-width:600px}p{max-width:510px;margin:0}
figure{height:630px;min-height:0;position:relative;isolation:isolate;margin:0;padding:32px 32px 32px 0}figure:before{content:'';position:absolute;inset:0;background:#b8c7b6;z-index:-2}figure:after{content:'';position:absolute;inset:0;mask:url('/brandkit/traccia-pattern.svg') repeat 0 0 / 384px 288px;background:#223d32;z-index:-1}figure img{display:block;width:100%;height:100%;object-fit:cover;border-radius:12px}
footer{margin-top:auto;font-size:18px;display:flex;align-items:center;gap:12px}footer:before{content:'';width:12px;height:12px;border-radius:50%;background:#f7b52b}
</style>
</head>
<body>
<main><div class="brand"><img src="/images/logo.png" alt="">LabManager</div><h1>Dalla ricetta<br>al banco.</h1><p>Il gestionale per laboratori artigianali alimentari.</p><footer>labmanagergestionale.com</footer></main>
<figure><img src="/images/editorial/hero-laboratorio.webp" alt="Mani al lavoro su un impasto"></figure>
</body></html>
